# Конфигурация Nginx для eg.sloboda43.netcraze.pro
# Разместить в: /etc/nginx/sites-available/eg_sloboda43

# 1. HTTP → HTTPS редирект
server {
    listen 80;
    listen [::]:80;
    server_name eg.sloboda43.netcraze.pro;
    
    # Перенаправление на HTTPS
    return 301 https://$server_name$request_uri;
}

# 2. HTTPS основной сервер
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name eg.sloboda43.netcraze.pro;
    
    # Пути к SSL сертификатам (нужно заменить на реальные)
    ssl_certificate /etc/ssl/certs/eg_sloboda43.crt;
    ssl_certificate_key /etc/ssl/private/eg_sloboda43.key;
    
    # Настройки безопасности SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Безопасные заголовки
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";
    
    # Корневая директория
    root /var/www/eg_sloboda43;
    index index.html;
    
    # Статические файлы
    location /static/ {
        alias /var/www/eg_sloboda43/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    location /favicon.ico {
        alias /var/www/eg_sloboda43/static/css/favicon.ico;
        expires 30d;
    }
    
    # Проксирование на Flask приложение
    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        
        # WebSocket поддержка (если понадобится)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Таймауты
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # Обработка ошибок
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    location = /50x.html {
        root /usr/share/nginx/html;
    }
    
    # Запрет доступа к скрытым файлам
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Блокировка логов favicon
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
    
    # Блокировка логов robots.txt
    location = /robots.txt {
        allow all;
        log_not_found off;
        access_log off;
    }
}