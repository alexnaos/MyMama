{% extends "base.html" %}

{% block title %}404 - Страница не найдена{% endblock %}

{% block content %}
<section class="min-h-screen flex items-center justify-center">
    <div class="text-center">
        <div class="inline-block mb-6">
            <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path></svg>
        </div>
        <h1 class="text-5xl font-bold text-gray-900 mb-4">404</h1>
        <p class="text-xl text-gray-600">Страница не найдена</p>
        <p class="text-gray-500">К сожалению, запрошенная страница не найдена на этом сервере.</p>
        <div class="mt-6">
            <a href="/" class="btn btn-primary">Вернуться на главную</a>
        </div>
    </div>
</section>
{% endblock %}
