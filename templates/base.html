<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{% block description %}Литературный сборник: поэзия и проза Эллы Гогелиани{% endblock %}">
    <title>{% block title %}Элла{% endblock %}</title>

    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='css/favicon.ico') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='css/favicon.ico') }}">

    <!-- Задача 1: Google-шрифты больше не нужны — весь сайт на Arial Narrow -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Задача 1: основной шрифт всего сайта — Arial Narrow */
        body { font-family: 'Arial Narrow', Arial, sans-serif; background: #f8f9fa; color: #2d3748; -webkit-font-smoothing: antialiased; }
        /* Класс сохранён для совместимости с шаблонами, но рендерит шрифт сайта */
        .font-merriweather { font-family: 'Arial Narrow', Arial, sans-serif; }
        a { color: #2d3748; text-decoration: none; transition: color 0.2s; }
        a:hover { color: #1d4ed8; }
        .container { max-width: 1280px; margin: 0 auto; padding: 0 1rem; }
        .card { background: #fff; border-radius: 0.75rem; padding: 1.5rem; box-shadow: 0 1px 2px 0 rgba(0,0,0,0.05); transition: all 0.2s; }
        .card:hover { box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.1); transform: translateY(-2px); }
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; padding: 0.75rem 1.5rem; border-radius: 0.5rem; font-weight: 500; transition: all 0.2s; cursor: pointer; }
        .btn-primary { background: #1d4ed8; color: white; }
        .btn-primary:hover { background: #2563eb; transform: translateY(-1px); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.1); color: white; }
        .btn-secondary { background: transparent; color: #2d3748; border: 2px solid #2d3748; }
        .btn-secondary:hover { background: #2d3748; color: white; }
        h1, h2, h3 { font-family: 'Arial Narrow', Arial, sans-serif; }
        /* Задача 1: h1/h2 уменьшены примерно на 20–30% */
        h1 { font-size: 1.75rem; line-height: 2.25rem; font-weight: 700; margin-bottom: 1rem; }
        h2 { font-size: 1.5rem; line-height: 2rem; font-weight: 600; margin-bottom: 1rem; }
        h3 { font-size: 1.25rem; line-height: 1.75rem; font-weight: 600; margin-bottom: 0.75rem; }
        .text-muted { color: #718096 !important; }
        .content-wrapper { max-width: 900px; margin: 0 auto; padding: 0 1rem; }
        /* Типографика художественных текстов */
        .literary-text { font-size: 1.0625rem; line-height: 1.9; color: #2d3748; }
        .literary-text p { margin: 0 0 1rem; }
        .literary-text h1, .literary-text h2, .literary-text h3 { margin-top: 1.5rem; }
        .literary-text blockquote { border-left: 3px solid #1d4ed8; padding-left: 1rem; color: #4a5568; margin: 1rem 0; }
        .literary-text img { max-width: 100%; height: auto; border-radius: 0.5rem; }
        @media (min-width: 640px) { .container { padding: 0 1.5rem; } }
        @media (min-width: 768px) {
            h1 { font-size: 2.25rem; line-height: 2.75rem; }
            h2 { font-size: 1.75rem; line-height: 2.25rem; }
        }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0s !important; transition-duration: 0s !important; } }
    </style>

</head>
<body class="flex flex-col min-h-screen">

<nav class="bg-white border-b border-gray-100 sticky top-0 z-50" style="background: white !important;">
    <div class="container max-w-7xl flex items-center justify-between h-16 gap-4">
        <a href="/" class="flex items-center gap-2 flex-shrink-0">
            <img src="{{ url_for('static', filename='images/logo.svg') }}"
                 alt="Элла" class="h-8 w-8 rounded-lg">
            <span class="font-merriweather text-xl font-bold text-gray-900 hidden sm:inline">Элла</span>
        </a>
<ul class="hidden md:flex items-center gap-4 lg:gap-6">
            <li><a href="/poetry/" class="{{ 'text-blue-700 font-medium' if active == 'poetry' else 'text-gray-600 hover:text-blue-700' }} transition-colors">Поэзия</a></li>
            <li><a href="/prose/" class="{{ 'text-blue-700 font-medium' if active == 'prose' else 'text-gray-600 hover:text-blue-700' }} transition-colors">Проза</a></li>
            <li><a href="/pieces/" class="{{ 'text-blue-700 font-medium' if active == 'articles' else 'text-gray-600 hover:text-blue-700' }} transition-colors">Статьи</a></li>
            <li><a href="/gallery/" class="{{ 'text-blue-700 font-medium' if active == 'gallery' else 'text-gray-600 hover:text-blue-700' }} transition-colors">Галерея</a></li>
            <li><a href="/contact/" class="{{ 'text-blue-700 font-medium' if active == 'contact' else 'text-gray-600 hover:text-blue-700' }} transition-colors">Контакты</a></li>
            <li><a href="/download/" class="{{ 'text-blue-700 font-medium' if active == 'download' else 'text-gray-600 hover:text-blue-700' }} transition-colors">Скачать</a></li>
        </ul>
        <form action="/search/" method="get" class="relative flex-shrink w-full max-w-xs">
            <svg class="absolute left-3 top-1/2 -translate-y-1/2 h-4 w-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            <input type="search" name="q" value="{{ request.args.get('q', '') }}"
                   placeholder="Поиск по сборнику..." aria-label="Поиск по сборнику"
                   class="pl-8 pr-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 w-full">
        </form>
    </div>
</nav>

<main class="flex-1 w-full">
    <div class="content-wrapper py-8 md:py-12">
        {% block content %}{% endblock %}
    </div>
</main>

<footer class="bg-gray-900 text-gray-300 py-8 mt-auto">
    <div class="container">
        <div class="flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="text-center md:text-left">
                <span class="font-merriweather text-xl font-bold text-white">Элла</span>
                <p class="text-sm text-gray-400">Поэзия и проза Эллы Гогелиани · 2026</p>
            </div>
            <div class="flex items-center gap-6 text-sm text-gray-400">
                <a href="/poetry/" class="hover:text-white transition-colors">Поэзия</a>
                <a href="/prose/" class="hover:text-white transition-colors">Проза</a>
                <a href="/pieces/" class="hover:text-white transition-colors">Статьи</a>
                <a href="/download/" class="hover:text-white transition-colors">Скачать</a>
                <a href="/contact/" class="hover:text-white transition-colors">Контакты</a>
            </div>
        </div>
        {% if social_links %}
        <div class="mt-6 pt-5 border-t border-gray-800 flex flex-wrap items-center justify-center gap-3">
            <span class="text-xs uppercase tracking-widest text-gray-500">Мы в&nbsp;соцсетях</span>
            {% for s in social_links %}
            <a href="{{ s.url }}" target="_blank" rel="noopener noreferrer"
               class="px-3 py-1 rounded-full border border-gray-700 text-sm text-gray-400 hover:text-white hover:border-blue-400 hover:bg-blue-900/30 transition-colors">
                {{ s.label }}
            </a>
            {% endfor %}
        </div>
        {% endif %}
    </div>
</footer>

</body>
</html>
