<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" role="img" aria-label="Эмблема литературного сборника: фантастические миры">
  <title>Литературный сборник</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A1930"/>
      <stop offset="0.55" stop-color="#12294C"/>
      <stop offset="1" stop-color="#1B3A66"/>
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C9E0F7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Основа -->
  <rect x="0" y="0" width="400" height="400" rx="40" fill="url(#bg)"/>

  <!-- Геометрия: сетка (концентр. окружности и линии) -->
  <g fill="none" stroke="#3E6FA8" stroke-opacity="0.35">
    <circle cx="268" cy="104" r="88"/>
    <circle cx="268" cy="104" r="118" stroke-dasharray="3 8"/>
  </g>
  <g stroke="#6E9FD8" stroke-opacity="0.18">
    <line x1="0" y1="120" x2="400" y2="120"/>
    <line x1="0" y1="160" x2="400" y2="160"/>
    <line x1="46" y1="0" x2="176" y2="232"/>
  </g>

  <!-- Звёзды -->
  <g fill="#FFFFFF">
    <circle cx="72" cy="78" r="2.4"/>
    <circle cx="128" cy="52" r="1.8"/>
    <circle cx="336" cy="66" r="2.2"/>
    <circle cx="352" cy="150" r="1.6"/>
    <circle cx="58" cy="168" r="1.7"/>
    <circle cx="182" cy="40" r="2"/>
  </g>

  <!-- Луна-планета (фантастический мир) -->
  <circle cx="268" cy="104" r="46" fill="url(#glow)"/>
  <circle cx="268" cy="104" r="44" fill="url(#moon)"/>
  <circle cx="268" cy="104" r="34" fill="none" stroke="#2F5D8C" stroke-opacity="0.35"/>
  <circle cx="268" cy="104" r="25" fill="none" stroke="#2F5D8C" stroke-opacity="0.22"/>
  <g fill="#BBD6F2">
    <circle cx="254" cy="96" r="4"/>
    <circle cx="281" cy="112" r="3"/>
    <circle cx="274" cy="90" r="2.2"/>
  </g>

  <!-- Дальние горы (геометрия треугольников), оттенки синего -->
  <polygon points="0,232 66,148 150,224 232,162 310,226 400,172 400,236 0,236" fill="#24537F"/>
  <polygon points="0,238 86,186 176,238 268,198 358,238 400,218 400,240 0,240" fill="#1C426E"/>

  <!-- Планета-портал за горами -->
  <circle cx="186" cy="196" r="84" fill="none" stroke="#326097" stroke-opacity="0.6"/>

  <!-- Река (белая, извилистая) -->
  <path d="M200,232 C196,258 224,268 216,294 C208,320 238,330 231,366 C228,384 234,394 240,402"
        fill="none" stroke="#EAF3FF" stroke-width="15" stroke-linecap="round"/>
  <path d="M204,234 C200,257 225,267 218,292 C210,318 238,328 231,364 C228,379 233,390 238,398"
        fill="none" stroke="#7FB4E6" stroke-width="4" stroke-linecap="round"
        stroke-dasharray="2 6" stroke-opacity="0.8" transform="translate(-6 0)"/>

  <!-- Передние холмы -->
  <path d="M0,272 92,240 184,266 280,236 362,262 400,246 400,400 0,400 Z" fill="#0D2547"/>

  <!-- Геометрический мотив: пирамида -->
  <path d="M316,300 300,348 344,348 Z" fill="none" stroke="#7FB4E6" stroke-opacity="0.5"/>
  <path d="M330,300 330,326 M316,322 344,322" stroke="#7FB4E6" stroke-opacity="0.35"/>
  <circle cx="320" cy="334" r="2.4" fill="#FFFFFF" stroke-opacity="0.5"/>

  <!-- Чёрный силуэт: земля и деревья -->
  <path d="M0,338 70,304 146,330 226,298 306,330 376,308 400,322 400,400 0,400 Z" fill="#05070D"/>

  <!-- Деревья-треугольники (чёрные) -->
  <g fill="#05070D">
    <polygon points="64,292 48,334 80,334"/>
    <polygon points="112,282 92,334 132,334"/>
    <polygon points="150,292 136,334 164,334"/>
    <polygon points="254,306 242,336 266,336"/>
    <polygon points="372,322 362,344 382,344"/>
  </g>
  <g fill="#0A0F1A">
    <rect x="61" y="334" width="6" height="16"/>
    <rect x="109" y="334" width="6" height="16"/>
    <rect x="147" y="334" width="6" height="16"/>
  </g>

  <!-- Отражение луны в реке -->
  <path d="M210,268 C207,282 214,296 209,310" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-opacity="0.7"/>
</svg>